<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Expense Tracker</title>

    <!-- Bootstrap 5 CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= NAVBAR ================= -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand mb-0 h1">
                💰 Personal Expense Tracker
            </span>
        </div>
    </nav>


    <!-- ================= MAIN CONTAINER ================= -->
    <div class="container my-4">

        <!-- Page Heading -->
        <div class="text-center mb-4">
            <h1>Expense Tracker</h1>

            <p class="text-muted">
                Manage and track your daily expenses easily
            </p>
        </div>


        <!-- ================= SUMMARY CARDS ================= -->
        <div class="row g-3 mb-4">

            <!-- Total Expenses -->
            <div class="col-md-4">
                <div class="card summary-card">
                    <div class="card-body text-center">

                        <h5>Total Expenses</h5>

                        <h2 id="totalAmount">
                            ₹0
                        </h2>

                    </div>
                </div>
            </div>


            <!-- Total Transactions -->
            <div class="col-md-4">
                <div class="card summary-card">
                    <div class="card-body text-center">

                        <h5>Total Transactions</h5>

                        <h2 id="totalTransactions">
                            0
                        </h2>

                    </div>
                </div>
            </div>


            <!-- Average Expense -->
            <div class="col-md-4">
                <div class="card summary-card">
                    <div class="card-body text-center">

                        <h5>Average Expense</h5>

                        <h2 id="averageAmount">
                            ₹0
                        </h2>

                    </div>
                </div>
            </div>

        </div>


        <!-- ================= ADD EXPENSE ================= -->
        <div class="card mb-4">

            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">
                    Add Expense
                </h4>
            </div>


            <div class="card-body">

                <form id="expenseForm">

                    <div class="row g-3">

                        <!-- Expense Name -->
                        <div class="col-md-3">

                            <label class="form-label">
                                Expense Name
                            </label>

                            <input
                                type="text"
                                id="expenseName"
                                class="form-control"
                                placeholder="e.g. Food"
                                required
                            >

                        </div>


                        <!-- Amount -->
                        <div class="col-md-2">

                            <label class="form-label">
                                Amount
                            </label>

                            <input
                                type="number"
                                id="expenseAmount"
                                class="form-control"
                                placeholder="₹"
                                min="1"
                                required
                            >

                        </div>


                        <!-- Category -->
                        <div class="col-md-2">

                            <label class="form-label">
                                Category
                            </label>

                            <select
                                id="expenseCategory"
                                class="form-select"
                                required
                            >

                                <option value="">
                                    Select
                                </option>

                                <option value="Food">
                                    Food
                                </option>

                                <option value="Travel">
                                    Travel
                                </option>

                                <option value="Shopping">
                                    Shopping
                                </option>

                                <option value="Education">
                                    Education
                                </option>

                                <option value="Entertainment">
                                    Entertainment
                                </option>

                                <option value="Other">
                                    Other
                                </option>

                            </select>

                        </div>


                        <!-- Date -->
                        <div class="col-md-3">

                            <label class="form-label">
                                Date
                            </label>

                            <input
                                type="date"
                                id="expenseDate"
                                class="form-control"
                                required
                            >

                        </div>


                        <!-- Add Button -->
                        <div class="col-md-2 d-flex align-items-end">

                            <button
                                type="submit"
                                class="btn btn-primary w-100"
                            >
                                Add Expense
                            </button>

                        </div>

                    </div>

                </form>

            </div>

        </div>


        <!-- ================= FILTERS ================= -->
        <div class="card mb-4">

            <div class="card-header">
                <h5 class="mb-0">
                    Filter Expenses
                </h5>
            </div>


            <div class="card-body">

                <div class="row g-3">

                    <!-- Category Filter -->
                    <div class="col-md-4">

                        <label class="form-label">
                            Category
                        </label>

                        <select
                            id="filterCategory"
                            class="form-select"
                        >

                            <option value="All">
                                All Categories
                            </option>

                            <option value="Food">
                                Food
                            </option>

                            <option value="Travel">
                                Travel
                            </option>

                            <option value="Shopping">
                                Shopping
                            </option>

                            <option value="Education">
                                Education
                            </option>

                            <option value="Entertainment">
                                Entertainment
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>


                    <!-- Search -->
                    <div class="col-md-4">

                        <label class="form-label">
                            Search
                        </label>

                        <input
                            type="text"
                            id="searchExpense"
                            class="form-control"
                            placeholder="Search expense..."
                        >

                    </div>


                    <!-- Clear Filters -->
                    <div class="col-md-4 d-flex align-items-end">

                        <button
                            type="button"
                            id="clearFilters"
                            class="btn btn-secondary w-100"
                        >
                            Clear Filters
                        </button>

                    </div>

                </div>

            </div>

        </div>


        <!-- ================= EXPENSE LIST ================= -->
        <div class="card">

            <div class="card-header bg-dark text-white">

                <h4 class="mb-0">
                    Expense List
                </h4>

            </div>


            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-hover align-middle">

                        <thead class="table-light">

                            <tr>

                                <th>
                                    #
                                </th>

                                <th>
                                    Expense
                                </th>

                                <th>
                                    Amount
                                </th>

                                <th>
                                    Category
                                </th>

                                <th>
                                    Date
                                </th>

                                <th>
                                    Action
                                </th>

                            </tr>

                        </thead>


                        <tbody id="expenseTable">

                            <!-- Expenses will be added here using JavaScript -->

                        </tbody>

                    </table>

                </div>


                <!-- No Expense Message -->
                <div
                    id="noExpense"
                    class="text-center text-muted py-4"
                >
                    No expenses added yet.
                </div>

            </div>

        </div>

    </div>


    <!-- ================= JAVASCRIPT LIBRARIES ================= -->

    <!-- jQuery -->
    <script
        src="https://code.jquery.com/jquery-3.7.1.min.js">
    </script>


    <!-- Bootstrap 5 JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- Custom JavaScript -->
    <script src="script.js"></script>

</body>

</html>
